<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tailwind Recipe Lab — reusable Tailwind CSS recipes for frontend development.">
    <title>Tailwind Recipe Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/output.css">
</head>

<body class="min-h-screen bg-white font-['Manrope'] text-slate-950">

    <main class="mx-auto max-w-[1440px] px-10 py-14">

        <section class="border-b border-slate-200 pb-12">
            <div class="flex items-end justify-between gap-10">
                <div>
                    <div class="mb-4 font-['DM_Mono'] text-xs uppercase tracking-[0.16em] text-cyan-500">
                        Frontend Recipes
                    </div>

                    <h1 class="max-w-4xl text-6xl font-extrabold tracking-[-0.055em] text-slate-950">
                        Tailwind Recipe Lab
                    </h1>

                    <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-500">
                        Reusable Tailwind CSS recipes for real frontend projects.
                        Search, preview and copy exactly what you need.
                    </p>
                </div>

                <div class="min-w-[160px] rounded-2xl border border-slate-200 bg-slate-50 px-6 py-5">
                    <div class="font-['DM_Mono'] text-[10px] uppercase tracking-[0.14em] text-slate-400">
                        Visible Recipes
                    </div>

                    <div id="recipe-count" class="mt-2 text-3xl font-extrabold tracking-[-0.04em] text-slate-950">
                        0
                    </div>
                </div>
            </div>
        </section>

        <section class="border-b border-slate-200 py-8">
            <div class="flex flex-col gap-5">

                <div class="relative">
                    <div
                        class="pointer-events-none absolute left-5 top-1/2 -translate-y-1/2 font-['DM_Mono'] text-sm text-slate-400">
                        /
                    </div>

                    <input id="recipe-search" type="search" placeholder="Search buttons, gradients, glass, loaders..."
                        autocomplete="off"
                        class="w-full rounded-2xl border border-slate-200 bg-slate-50 py-4 pl-12 pr-5 text-sm font-medium text-slate-950 outline-none transition placeholder:text-slate-400 focus:border-cyan-400 focus:bg-white focus:ring-4 focus:ring-cyan-100">
                </div>

                <div id="category-filters" class="flex flex-wrap gap-2"></div>

            </div>
        </section>

        <div id="recipe-sections"></div>

        <section id="empty-state" class="hidden py-28 text-center">
            <div
                class="mx-auto flex size-14 items-center justify-center rounded-2xl bg-slate-100 font-['DM_Mono'] text-lg text-slate-500">
                ?
            </div>

            <h2 class="mt-6 text-2xl font-extrabold tracking-[-0.035em] text-slate-950">
                No recipes found
            </h2>

            <p class="mt-2 text-sm text-slate-500">
                Try another search term or category.
            </p>
        </section>

    </main>

    <div id="recipe-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-8">
        <div id="recipe-modal-backdrop" class="absolute inset-0 bg-slate-950/60 backdrop-blur-sm"></div>

        <div
            class="relative z-10 max-h-[90vh] w-full max-w-5xl overflow-y-auto rounded-3xl border border-slate-200 bg-white shadow-2xl shadow-slate-950/20">
            <div
                class="sticky top-0 z-20 flex items-start justify-between gap-8 border-b border-slate-200 bg-white px-8 py-7">
                <div>
                    <div id="modal-category"
                        class="font-['DM_Mono'] text-[10px] uppercase tracking-[0.15em] text-cyan-500"></div>

                    <h2 id="modal-title" class="mt-2 text-3xl font-extrabold tracking-[-0.045em] text-slate-950"></h2>

                    <p id="modal-description" class="mt-3 max-w-2xl text-sm leading-6 text-slate-500"></p>
                </div>

                <button id="modal-close" type="button"
                    class="flex size-10 shrink-0 items-center justify-center rounded-xl border border-slate-200 bg-white text-xl text-slate-500 transition hover:border-slate-300 hover:bg-slate-50 hover:text-slate-950"
                    aria-label="Close">
                    ×
                </button>
            </div>

            <div class="grid gap-6 p-8">

                <section>
                    <div class="mb-3 flex items-center justify-between">
                        <div class="font-['DM_Mono'] text-[10px] uppercase tracking-[0.14em] text-slate-400">
                            Live Preview
                        </div>

                        <div
                            class="rounded-full bg-emerald-50 px-3 py-1 font-['DM_Mono'] text-[9px] font-medium uppercase tracking-[0.1em] text-emerald-600">
                            Tailwind
                        </div>
                    </div>

                    <div id="modal-preview"
                        class="flex min-h-64 items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 p-10">
                    </div>
                </section>

                <section class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-950">
                    <div class="flex items-center justify-between border-b border-white/10 px-5 py-4">
                        <div>
                            <div class="font-['DM_Mono'] text-[10px] uppercase tracking-[0.14em] text-slate-400">
                                Tailwind HTML
                            </div>
                        </div>

                        <button id="copy-code" type="button"
                            class="rounded-lg bg-cyan-400 px-4 py-2 font-['DM_Mono'] text-[10px] font-medium uppercase tracking-[0.08em] text-slate-950 transition hover:bg-cyan-300 active:scale-95">
                            Copy code
                        </button>
                    </div>

                    <pre class="max-h-[420px] overflow-auto p-6"><code
                    id="modal-code"
                    class="font-['DM_Mono'] text-[12px] leading-7 text-slate-200"
                ></code></pre>
                </section>

            </div>
        </div>
    </div>

    <script src="/app.js"></script>

</body>

</html>
